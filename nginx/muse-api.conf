# =============================================================================
# muse-api.conf — VPS Nginx 生产配置：VM → VPS HTTPS 命令通道
# =============================================================================
# 来源：Gemini 4 架构评审
# - 第一轮评审 §3.2：upstream keepalive + location /muse-api/ 完整模板
# - 第二轮评审 §3.3/§3.4：TLS 会话复用配置 + 严禁 0-RTT
# - 安全加固评审：vps-auth-patch/nginx-muse-api-secure.conf.example（限流参考）
#
# 部署位置（VPS 38.207.167.51）：/etc/nginx/conf.d/muse-api.conf 或
# sites-enabled 下对应文件。部署前必须先 `nginx -t`，再 `systemctl reload nginx`。
#
# ⚠️ 重要：本文件只覆盖 ai.vps38.local 的 443 server 块中与 /muse-api/ 相关的部分。
# VPS 上现有的 WSS 长连接 location（PC 插件走的通道）必须原样保留，
# 见下方 "EXISTING WSS LOCATION" 占位注释——部署时把现有 WSS 段拷进来，
# 绝不能用本文件整体覆盖掉已有的 server 块！
# ⚠️ 本 server 块绝不能设为 default_server：无 SNI 的请求会被上游 xray 掐掉
# （这正是 2026-10-17 的 1006 循环故障根因），SNI=ai.vps38.local 是路由依据。
# =============================================================================

# --- 1. upstream：定义在 http{} 顶层（与 server 块平级） -----------------------
upstream muse_cmd_backend {
server 127.0.0.1:8471 max_fails=0;

# 每个 Nginx worker 进程保持的最大空闲长连接数。
# Daemon 侧连接池上限 16 条，Nginx 侧 32 条留有余量。
keepalive 32;

# 单条长连接最大复用请求数：防止 Python 服务端长期运行的内存微泄漏累积。
keepalive_requests 100000;

# 空闲长连接保持时间。必须略小于 8471 Python 服务端的 idle timeout，
# 让 Nginx 侧先断，避免"服务端已 FIN、Nginx 恰好复用"的竞态。
keepalive_timeout 60s;
}

# --- 2. server 块 -------------------------------------------------------------
server {
listen 443 ssl http2;
server_name ai.vps38.local;

# 服务器证书：自建 PKI（VPS38 Root CA 签发，SAN 含 IP + ai.vps38.local）。
# 2026-10-18 已切换；旧 example.pem/key 备份为.bak-20261018。
ssl_certificate /etc/ssl/certs/vps38-server.pem;
ssl_certificate_key /etc/ssl/private/vps38-server.key;
# ↑ 若 key 文件名与此处不一致，以 VPS 实际文件名为准，改这一行即可。

# --- TLS 会话复用（第二轮评审 §3.3/§3.4） --------------------------------
ssl_protocols TLSv1.2 TLSv1.3;

# 共享内存会话缓存：10MB 约可缓存 40,000 个会话，供 TLS Session Ticket /
# TLS 1.3 PSK 快速恢复（1-RTT），Daemon 连接池重建连接时省去完整握手。
ssl_session_cache shared:MuseSSL:10m;
ssl_session_timeout 1h;
ssl_session_tickets on;

# ⛔ 严禁开启 ssl_early_data！
# TLS 1.3 0-RTT Early Data 不具备防重放（Anti-Replay）保护，
# 中间网络设备重传 0-RTT 包会导致非幂等 /cmd 在 VPS 上被直接重放执行。
# 此处显式关闭，Nginx 默认即为 off，写出来是防止后人手贱打开。
ssl_early_data off;

# --- 客户端侧长连接 ------------------------------------------------------
# 单条客户端连接允许的最大请求数：避免 H2 / Keep-Alive 频繁重连。
keepalive_requests 100000;
# 客户端空闲超时：75s > upstream 的 60s，保证总是上游先断、Nginx 侧不踩竞态。
keepalive_timeout 75s;

# --- 3. /muse-api/：VM Daemon 命令通道 ------------------------------------
location /muse-api/ {
proxy_pass http://muse_cmd_backend;

# 启用 HTTP/1.1 并清空 Connection 头，激活 upstream keepalive。
# 缺了这三行，Nginx 对 127.0.0.1:8471 默认用 HTTP/1.0 短连接，
# 每次请求都走回环 TCP 三次握手+四次挥手，堆积 TIME_WAIT 并给 Python
# 服务端造成 1~3ms 的 accept() 抖动。
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_socket_keepalive on;

# 传递真实客户端信息：8471 鉴权层用 X-Real-IP 校验 allowed_ips；
# Host 透传保证 SNI/Host 一致性检查不误杀。
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# 禁用代理缓冲：小包命令直通，降低转发延迟；
# /file 大包走应用层 64KB 分块 + 端到端压缩，不依赖 Nginx 缓冲。
proxy_buffering off;
proxy_request_buffering off;

# 超时：连本机必须极快；读超时需容纳长耗时命令（/batch 上限 300s）。
proxy_connect_timeout 2s;
proxy_send_timeout 60s;
proxy_read_timeout 300s;

# 可选：限流（默认关闭，需要时取消注释）。
# 参考安全加固评审 vps-auth-patch/nginx-muse-api-secure.conf.example：
# limit_req_zone $binary_remote_addr zone=museapi:10m rate=10r/s; # http{} 顶层
# limit_req zone=museapi burst=20 nodelay;
# limit_req_status 429;
# client_max_body_size 1m; # 配合鉴权层 MAX_BODY_SIZE 防内存 DoS
# 注意：burst 20 对 AI 并行扇出（5~15 并发）是够的；若误杀合法突发再调大。
}

# --- 4. EXISTING WSS LOCATION（占位，部署时填入现有配置） ------------------
# VPS 上 PC 插件的 WSS 长连接 location 目前就在这个 443 server 块里。
# 部署本文件时：把现有的 WSS location 段原样拷到这里，不要删除、不要改动。
# （本文件不自带 WSS 段，因为各 VPS 现状配置可能有差异，以线上为准。）
#
# 示例占位（删除本注释、换成真实配置）：
# location /wss/ {
# proxy_pass http://127.0.0.1:8471;
# proxy_http_version 1.1;
# proxy_set_header Upgrade $http_upgrade;
# proxy_set_header Connection "upgrade";
#...（线上现有配置，原样保留）
#}
}
